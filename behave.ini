[behave]
# Where Behave looks for feature files (default is ./features)
paths = features

# Stop the whole run on the first failing scenario instead of continuing
stop = false

# Show the full traceback when a step errors — very useful while developing
show_timings = true

# Skip scenarios tagged @wip by default (work-in-progress)
tags = ~@wip

# Default output style. "pretty" = colourful readable console output
default_format = pretty

# Treat every undefined/ambiguous step as an error rather than a warning
show_skipped = false

[behave.userdata]
# Custom key=value pairs YOU define, read in code via context.config.userdata
browser = chrome
env = staging # or prod

[behave.formatters]
# Register the Allure formatter under a short alias so you can call it easily
allure = allure_behave.formatter:AllureFormatter