[behave]
# Where Behave looks for feature files (default is ./features)
paths = features

# Stop the whole run on the first failing scenario instead of continuing
stop = false

# reports step/scenario durations.
show_timings = true

# Skip scenarios tagged @wip by default (work-in-progress)
tags = ~@wip

# Run two formatters every time: readable console output, and Allure results
# for reporting. Each line in outfiles pairs positionally with the same line
# in format — "-" means stdout.
format = pretty
         allure
outfiles = -
           reports/allure-results

# Option controls whether skipped steps/scenarios are printed
show_skipped = false

[behave.userdata]
# Custom key=value pairs YOU define, read in code via context.config.userdata
# Override on the command line, e.g.: behave -D browser=firefox -D env=prod
browser = firefox
env = prod

[behave.formatters]
# Register the Allure formatter under a short alias so 'format = allure' above resolves
allure = allure_behave.formatter:AllureFormatter